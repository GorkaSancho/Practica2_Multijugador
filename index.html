<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Duel de Fletxes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Tot el contingut del joc l'omple script.js a partir d'aquests contenidors (per id) -->
  <main class="app">
    <!-- Capçalera: títol, mode de joc i rellotge -->
    <header class="top">
      <div>
        <h1>Duel de Fletxes</h1>
        <p class="mode" id="mode">Entrenament · un jugador</p>
      </div>
      <div class="clock">
        <div class="label">Temps</div>
        <div class="time" id="clock">0.0 s</div>
      </div>
    </header>

    <div class="layout">
      <!-- Tauler: punts, combinació, missatge d'estat, comandament i pantalles superposades -->
      <section class="board" aria-label="Tauler">
        <div class="score">
          <div class="pips" id="pips"></div>
          <div class="count" id="count">0 / 5</div>
        </div>
        <div class="stage" id="stage" role="img" aria-label="Combinació de fletxes"></div>
        <p class="status" id="status" aria-live="polite"></p>
        <div class="pad" id="pad"></div>
        <div class="overlay" id="overlay"></div>
      </section>

      <!-- Classificació (només visible en mode en línia) -->
      <aside class="side" id="side" hidden></aside>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
